name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [format, lint, types, tests, build]
        include:
          - check: format
            command: pnpm format:check
          - check: lint
            command: pnpm lint
          - check: types
            command: pnpm typecheck
          - check: tests
            command: pnpm test --passWithNoTests
          - check: build
            command: pnpm build
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Foundation test scope
        if: matrix.check == 'tests'
        run: echo 'Foundation only - no product tests exist yet. The test runner permits an empty suite until the first flight implementation.' >> "$GITHUB_STEP_SUMMARY"
      - run: ${{ matrix.command }}
